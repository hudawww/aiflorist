<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Florist</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Efek garis peringatan ala proyek konstruksi */
        .construction-stripe {
            background: repeating-linear-gradient(
                -45deg,
                #facc15,
                #facc15 20px,
                #1e293b 20px,
                #1e293b 40px
            );
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-yellow-400 selection:text-slate-950">

    <!-- Garis Atas -->
    <div class="h-4 construction-stripe w-full shadow-lg"></div>

    <!-- Konten Utama di Tengah -->
    <main class="max-w-xl mx-auto px-6 py-12 text-center my-auto">
        
        <!-- Ikon / Animasi Kedip Sederhana -->
        <div class="inline-block p-4 bg-yellow-400/10 border border-yellow-400/30 rounded-2xl mb-6 text-yellow-400 animate-pulse">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="stroke-width" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
            </svg>
        </div>

        <h1 class="text-3xl md:text-4xl font-black tracking-wider uppercase mb-3 text-yellow-400">
            Dalam Proses Pembangunan
        </h1>

        <p class="text-slate-400 text-sm md:text-base mb-8 leading-relaxed">
            Situs web <strong class="text-slate-200">Ai Florist</strong> sedang dalam proses pembangunan. Silahkan hubungi kontraktor <span class="text-yellow-400 font-semibold underline decoration-dotted underline-offset-4">BAJINDUL GARAGE</span> untuk info lebih lanjut.
        </p>

        <div class="inline-block bg-slate-900 border border-slate-800 rounded-xl px-6 py-3 text-xs tracking-widest uppercase text-slate-500 font-mono">
            pembangunan menggunakan dana pribadi dan tidak menggunakan dana APBN maupun APBD 🚧
        </div>

    </main>

    <!-- Garis Bawah -->
    <div class="h-4 construction-stripe w-full shadow-lg"></div>

</body>
</html>
